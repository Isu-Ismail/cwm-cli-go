name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Publish Pre-Built Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/win/*
            release/mac/*
            release/deb/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
