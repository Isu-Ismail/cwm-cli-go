name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Matching Release Directory & Version
        id: check_dir
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            COMMIT_MSG=$(git log -1 --pretty=%B)
            echo "Latest Commit Message: ${COMMIT_MSG}"
            if [[ "${COMMIT_MSG}" == *"forcepub"* ]] || [[ "${COMMIT_MSG}" == *"[publish]"* ]]; then
              TAG_NAME=$(git describe --tags --abbrev=0 2>/dev/null || echo "v2.0.0")
            else
              echo "Commit message does not contain 'forcepub' or '[publish]'. Skipping automatic release."
              echo "dir_exists=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          RELEASE_DIR="release/release-${TAG_NAME}"
          echo "Target Tag: ${TAG_NAME}"
          echo "Target Release Directory: ${RELEASE_DIR}"

          if [ -d "${RELEASE_DIR}" ]; then
            echo "dir_exists=true" >> $GITHUB_OUTPUT
            echo "release_dir=${RELEASE_DIR}" >> $GITHUB_OUTPUT
            echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          else
            echo "::error::Release directory '${RELEASE_DIR}' does not exist! Skipping GitHub Release creation."
            echo "dir_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish Pre-Built Assets to Release
        if: steps.check_dir.outputs.dir_exists == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_dir.outputs.tag_name }}
          files: |
            ${{ steps.check_dir.outputs.release_dir }}/win/*
            ${{ steps.check_dir.outputs.release_dir }}/mac/*
            ${{ steps.check_dir.outputs.release_dir }}/deb/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
